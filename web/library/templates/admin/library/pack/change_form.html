{% extends "admin/change_form.html" %}
{% load i18n admin_urls static admin_modify %}

{% block extrahead %}
{{ block.super }}
<style>
  #upload-progress-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(8px);
    z-index: 999999;
    display: none;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
  }
  .progress-card {
    background: #1e293b;
    border: 1px solid #334155;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    border-radius: 12px;
    width: 90%;
    max-width: 550px;
    padding: 28px;
    color: #f8fafc;
  }
  .progress-title-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .progress-spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #38bdf8;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .progress-bar-track {
    background: #0f172a;
    border-radius: 8px;
    height: 14px;
    overflow: hidden;
    margin: 16px 0 8px 0;
    border: 1px solid #334155;
  }
  .progress-bar-fill {
    background: linear-gradient(90deg, #0284c7, #38bdf8);
    height: 100%;
    width: 0%;
    transition: width 0.3s ease-in-out;
  }
  .progress-stats {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #94a3b8;
    font-weight: 500;
  }
  .status-text-box {
    margin-top: 16px;
    padding: 12px 16px;
    background: #0f172a;
    border-radius: 8px;
    border: 1px solid #1e293b;
    font-size: 13.5px;
    color: #e2e8f0;
    min-height: 48px;
    display: flex;
    align-items: center;
  }
  .log-stream {
    margin-top: 12px;
    max-height: 120px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 11.5px;
    color: #64748b;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
</style>

<div id="upload-progress-overlay">
  <div class="progress-card">
    <div class="progress-title-row">
      <div class="progress-spinner"></div>
      <h3 style="margin:0; font-size:18px; font-weight:600; color:#ffffff;">Processing Pack Upload</h3>
    </div>
    
    <div class="progress-bar-track">
      <div id="progress-bar-fill" class="progress-bar-fill"></div>
    </div>
    
    <div class="progress-stats">
      <span id="progress-status-label">Initializing...</span>
      <span id="progress-percent-label">0%</span>
    </div>

    <div class="status-text-box" id="status-text-message">
      Preparing upload...
    </div>

    <div class="log-stream" id="log-stream-box"></div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const form = document.getElementById("pack_form") || document.querySelector("form");
  if (!form) return;

  form.addEventListener("submit", function(e) {
    const fileInputs = form.querySelectorAll("input[type=file]");
    let hasFiles = false;
    fileInputs.forEach(input => {
      if (input.files && input.files.length > 0) hasFiles = true;
    });

    // Only intercept for main pack additions with files
    if (!hasFiles) return;

    e.preventDefault();

    const overlay = document.getElementById("upload-progress-overlay");
    const fill = document.getElementById("progress-bar-fill");
    const statusLabel = document.getElementById("progress-status-label");
    const percentLabel = document.getElementById("progress-percent-label");
    const messageBox = document.getElementById("status-text-message");
    const logBox = document.getElementById("log-stream-box");

    overlay.style.display = "flex";

    function appendLog(text) {
      const item = document.createElement("div");
      item.textContent = text;
      logBox.appendChild(item);
      logBox.scrollTop = logBox.scrollHeight;
    }

    const formData = new FormData(form);

    const xhr = new XMLHttpRequest();
    // Target the custom stream upload endpoint
    xhr.open("POST", "stream-upload/", true);

    // Track network upload progress (0% to 20%)
    xhr.upload.onprogress = function(event) {
      if (event.lengthComputable) {
        const uploadPct = Math.round((event.loaded / event.total) * 20);
        fill.style.width = uploadPct + "%";
        percentLabel.textContent = uploadPct + "%";
        statusLabel.textContent = "Uploading files to server...";
        messageBox.textContent = `Uploading audio files (${Math.round(event.loaded/1024/1024)}MB / ${Math.round(event.total/1024/1024)}MB)...`;
      }
    };

    let processedIndex = 0;

    xhr.onprogress = function() {
      const lines = xhr.responseText.split("\n");
      for (; processedIndex < lines.length - 1; processedIndex++) {
        const line = lines[processedIndex].trim();
        if (!line) continue;
        try {
          const data = JSON.parse(line);
          if (data.percent !== undefined) {
            fill.style.width = data.percent + "%";
            percentLabel.textContent = data.percent + "%";
          }
          if (data.message) {
            messageBox.textContent = data.message;
            appendLog(data.message);
          }
          if (data.step) {
            statusLabel.textContent = data.step.replace(/_/g, " ").toUpperCase();
          }
          if (data.status === "complete") {
            fill.style.width = "100%";
            percentLabel.textContent = "100%";
            statusLabel.textContent = "Complete!";
            messageBox.textContent = "Pack upload & AI categorization complete!";
            setTimeout(() => {
              window.location.href = data.redirect_url || "../";
            }, 800);
          }
          if (data.status === "error") {
            alert("Error during upload: " + data.message);
            overlay.style.display = "none";
          }
        } catch (err) {
          // ignore partial json
        }
      }
    };

    xhr.onload = function() {
      if (xhr.status !== 200) {
        alert("Server returned error status: " + xhr.status);
        overlay.style.display = "none";
      }
    };

    xhr.onerror = function() {
      alert("Network connection error during upload.");
      overlay.style.display = "none";
    };

    xhr.send(formData);
  });
});
</script>
{% endblock %}
